name: Validate BLACK-PRIVATE device gate

on:
  push:
    branches:
      - feature/raspberry-pi-device-gate
  pull_request:
    branches:
      - main

jobs:
  worker-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check JavaScript syntax
        run: node --check src/index.js && node --check src/auth.js && node --check src/auth-store.js
      - name: Check Raspberry Pi agent syntax
        run: python -m py_compile raspberry-pi/device_agent.py
      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run
