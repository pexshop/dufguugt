<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d14">
<meta name="description" content="BLACK-PRIVATE — 私密端到端加密聊天室">
<title>BLACK-PRIVATE</title>
<style>
:root{color-scheme:dark;--bg:#090d14;--panel:#111925;--line:#243244;--muted:#8fa1b7;--text:#edf3fa;--accent:#70e1c1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#142536 0,var(--bg) 55%);color:var(--text);font:16px system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:22px 14px}
main{width:min(720px,100%);display:flex;flex-direction:column;gap:16px}.brand{font-size:13px;letter-spacing:.22em;color:var(--accent);font-weight:800}.hero h1{font-size:clamp(30px,7vw,46px);margin:6px 0}.hero p,.muted{color:var(--muted);line-height:1.6}.panel{background:#111925eF;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 16px 50px #0005}.row{display:flex;gap:9px;flex-wrap:wrap}button,input{font:inherit;border-radius:11px;padding:13px;border:1px solid var(--line);background:#0b121c;color:var(--text)}button{cursor:pointer;background:var(--accent);color:#07130f;border:0;font-weight:750}button.secondary{background:#1b2a3a;color:var(--text);border:1px solid var(--line)}input{width:100%;min-width:0;flex:1}#chat{display:none;min-height:65vh;gap:12px;flex-direction:column}#messages{flex:1;min-height:260px;max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:9px}.msg{background:#1a2838;border:1px solid #293b50;border-radius:13px;padding:11px 13px;max-width:88%;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:#153b35;border-color:#276b5b}.time{font-size:11px;color:var(--muted);margin-top:5px}.status{font-size:13px;color:var(--muted)}.notice{font-size:12px;color:var(--muted);line-height:1.55}.hidden{display:none!important}
</style>
</head>
<body><main>
<header class="hero"><div class="brand">BLACK / PRIVATE</div><h1>你的私密空间。</h1><p>端到端加密聊天室。消息在你的设备上加密，服务器只接收密文。</p></header>
<section class="panel" id="welcome"><h2>开始私密聊天</h2><p class="muted">创建一个新聊天室，或打开别人分享给你的邀请链接。</p><div class="row"><button id="create">创建加密聊天室</button><button class="secondary" id="copyInvite" disabled>复制邀请链接</button></div><p class="notice" id="inviteHint">创建后会生成只有持有邀请链接的人才能解密的房间密钥。请通过可信渠道分享链接。</p></section>
<section class="panel" id="chat"><div class="row" style="justify-content:space-between;align-items:center"><div><strong>私密聊天室</strong><div class="status" id="status">正在连接…</div></div><div class="row"><button class="secondary" id="reconnect" type="button">重新连接</button><button class="secondary" id="share" type="button">分享邀请链接</button><button class="secondary" id="lockNow" type="button">立即锁定</button></div></div><div id="messages" aria-live="polite"></div><form id="sendForm" class="row"><input id="message" maxlength="4000" placeholder="输入加密消息…" autocomplete="off" required><button>发送</button></form><div class="notice">消息内容使用 AES-GCM 在本机加密。请保存邀请链接；丢失密钥将无法恢复历史消息。</div></section>
<section class="panel hidden" id="locked"><h2>私密窗口已锁定</h2><p class="muted">聊天内容和临时解密密钥已从当前页面清除。重新验证设备与安全密钥后才能继续。</p><button id="unlock" type="button">重新验证并解锁</button></section>
<footer class="notice">BLACK-PRIVATE · 进入聊天室前必须完成设备认证。<a href="/device.html" style="color:#70e1c1">设备注册 / 登录</a> · 请勿把邀请链接发给不信任的人。</footer>
</main>
<script>
const $=id=>document.getElementById(id);
let roomId=null,key=null,socket=null,invite=null,seen=new Set(),myIds=new Set();
let reconnectTimer=null,reconnectAttempts=0,manualReconnect=false,connectionId=0,heartbeatTimer=null;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4)),c=>c.charCodeAt(0));
function makeInvite(){return location.origin+location.pathname+"#"+roomId+"."+b64(keyBytes)}
async function authStatus(){
 const response=await fetch("/api/auth/status",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:"{}"});
 if(!response.ok)throw new Error("设备认证服务暂不可用");
 return await response.json();
}
function goToDeviceLogin(){
 const returnTo=location.pathname+location.search+location.hash;
 location.href="/device.html?return="+encodeURIComponent(returnTo);
}
let keyBytes;
async function setup(id,raw){
 roomId=id;keyBytes=raw;key=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);
 invite=location.origin+location.pathname+"#"+id+"."+b64(raw);
 history.replaceState(null,"",invite);
 $("welcome").classList.add("hidden");$("chat").style.display="flex";
 $("status").textContent="正在连接安全通道…";
 connect();
}
function scheduleReconnect(){
 if(reconnectTimer||!roomId)return;
 const delay=Math.min(1000*Math.pow(2,reconnectAttempts),30000);
 reconnectAttempts=Math.min(reconnectAttempts+1,5);
 $("status").textContent="连接中断，"+Math.ceil(delay/1000)+" 秒后自动重连…";
 reconnectTimer=setTimeout(()=>{reconnectTimer=null;connect();},delay);
}
function connect(force=false){
 if(!roomId)return;
 if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null;}
 if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null;}
 if(socket&&(socket.readyState===WebSocket.OPEN||socket.readyState===WebSocket.CONNECTING)){
  if(!force)return;
  try{socket.close(4000,"Reconnect requested");}catch{}
 }
 const thisConnection=++connectionId;
 const proto=location.protocol==="https:"?"wss:":"ws:";
 $("status").textContent="正在连接安全通道…";
 let ws;
 try{ws=new WebSocket(proto+"//"+location.host+"/room/"+roomId);socket=ws;}
 catch{scheduleReconnect();return;}
 ws.onopen=()=>{
  if(thisConnection!==connectionId)return;
  reconnectAttempts=0;
  $("status").textContent="已连接 · 端到端加密";
  heartbeatTimer=setInterval(()=>{
   if(socket===ws&&ws.readyState===WebSocket.OPEN){
    try{ws.send(JSON.stringify({type:"auth_ping"}));}catch{}
   }
  },5000);
 };
 ws.onclose=()=>{
  if(thisConnection!==connectionId)return;
  if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null;}
  if(socket===ws)socket=null;
  scheduleReconnect();
 };
 ws.onerror=()=>{
  if(thisConnection!==connectionId)return;
  $("status").textContent="连接出现问题，准备重连…";
  try{ws.close();}catch{scheduleReconnect();}
 };
 ws.onmessage=async e=>{
  if(thisConnection!==connectionId)return;
  try{const p=JSON.parse(e.data);if(p.type!=="message"||seen.has(p.id))return;seen.add(p.id);
   const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(p.iv)},key,unb64(p.ciphertext));
   const data=JSON.parse(new TextDecoder().decode(plain));render(data.text,p.createdAt,myIds.has(p.id));
  }catch{}
 };
}
$("reconnect").onclick=()=>{
 reconnectAttempts=0;
 if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null;}
 connect(true);
};
function lockPrivateWindow(){
 if(!roomId)return;
 if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null;}
 if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null;}
 connectionId++;
 const activeSocket=socket;socket=null;
 if(activeSocket){try{activeSocket.close(1000,"Private window locked");}catch{}}
 try{keyBytes?.fill(0);}catch{}
 keyBytes=null;key=null;invite=null;roomId=null;
 seen.clear();myIds.clear();
 $("messages").replaceChildren();
 $("message").value="";
 $("chat").classList.add("hidden");
 $("locked").classList.remove("hidden");
}
function unlockPrivateWindow(){
 const returnTo=location.pathname+location.search+location.hash;
 location.href="/device.html?return="+encodeURIComponent(returnTo);
}
$("lockNow").onclick=lockPrivateWindow;
$("unlock").onclick=unlockPrivateWindow;
document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="hidden")lockPrivateWindow();
});
window.addEventListener("pagehide",lockPrivateWindow);
window.addEventListener("online",()=>{
 if(roomId&&(!socket||socket.readyState!==WebSocket.OPEN)){reconnectAttempts=0;connect();}
});
function render(text,at,mine){
 const el=document.createElement("div");el.className="msg"+(mine?" mine":"");
 const body=document.createElement("div");body.textContent=text;
 const time=document.createElement("div");time.className="time";time.textContent=new Date(at).toLocaleString();
 el.append(body,time);$("messages").append(el);$("messages").scrollTop=$("messages").scrollHeight;
}
$("create").onclick=async()=>{
 try{
  const auth=await authStatus();
  if(!auth.authenticated){goToDeviceLogin();return;}
  const id=b64(crypto.getRandomValues(new Uint8Array(24))).replace(/[-_]/g,"a").slice(0,32).toLowerCase().replace(/[^a-f0-9]/g,"b");
 const raw=crypto.getRandomValues(new Uint8Array(32));await setup(id,raw);$("copyInvite").disabled=false;$("inviteHint").textContent="聊天室已创建。点击“分享邀请链接”把密钥链接发送给聊天对象。";
 }catch(e){alert("创建失败："+e.message)}
};
async function copyInvite(){if(!invite)return;try{await navigator.clipboard.writeText(invite);$("status").textContent="邀请链接已复制";}catch{prompt("复制以下邀请链接：",invite)}}
$("copyInvite").onclick=copyInvite;$("share").onclick=copyInvite;
$("sendForm").onsubmit=async e=>{
 e.preventDefault();const text=$("message").value.trim();if(!text||!socket||socket.readyState!==1)return;
 const id=crypto.randomUUID(),createdAt=Date.now(),iv=crypto.getRandomValues(new Uint8Array(12));
 const encrypted=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify({text})));
 myIds.add(id);socket.send(JSON.stringify({type:"message",id,createdAt,iv:b64(iv),ciphertext:b64(encrypted)}));$("message").value="";
};
(async()=>{
 if(!crypto.subtle){$("inviteHint").textContent="需要 HTTPS 安全连接才能使用加密功能。";return}
 const parts=location.hash.slice(1).split(".");
 if(parts.length===2&&/^[a-f0-9]{32}$/.test(parts[0])){
  try{
   const auth=await authStatus();
   if(!auth.authenticated){goToDeviceLogin();return;}
   await setup(parts[0],unb64(parts[1]));
  }catch(e){$("inviteHint").textContent="设备认证检查失败："+e.message;}
 }else{
  try{const auth=await authStatus();if(!auth.authenticated)$("inviteHint").textContent="请先完成 Raspberry Pi 设备与 FIDO2 安全密钥认证，再创建或加入聊天室。";}
  catch{$("inviteHint").textContent="设备认证服务暂不可用，请稍后重试。";}
 }
})();
</script></body></html>
